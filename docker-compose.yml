services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: groww_lens
      POSTGRES_USER: groww
      POSTGRES_PASSWORD: groww
    ports:
      - "55432:5432"
    volumes:
      - groww_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groww -d groww_lens"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - groww_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  groww_postgres_data:
  groww_redis_data:
